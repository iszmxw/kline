version: '3'

services:
  xw-client:
    image: hub.ssmartoption.com/iqoption-client:latest
    container_name: xw-client
    restart: always
    environment:
      CONFIG_FILE: ./config
    volumes:
      - /home/yezhiming/binary/client:/home/yezhiming/binary/client/config
      - /home/yezhiming/binary/logs:/home/yezhiming/binary/client/logs
    ports:
      - "7104:7104"
    network_mode: "host"
    # 日志记录文件数量和文件大小
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  xw-email:
    image: hub.ssmartoption.com/iqoption-email:latest
    container_name: xw-email
    restart: always
    environment:
      CONFIG_FILE: ./config
    volumes:
      - /home/yezhiming/binary/email:/home/yezhiming/binary/email/config
      - /home/yezhiming/binary/logs:/home/yezhiming/binary/email/logs
    ports:
      - "7107:7107"
    network_mode: "host"
    # 日志记录文件数量和文件大小
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  xw-web:
    image: hub.ssmartoption.com/iqoption-web:latest
    container_name: xw-web
    restart: always
    environment:
      CONFIG_FILE: ./config
    volumes:
      - /home/yezhiming/binary/web:/home/yezhiming/binary/web/config
      - /home/yezhiming/binary/logs:/home/yezhiming/binary/web/logs
    ports:
      - "7105:7105"
    network_mode: "host"
    # 日志记录文件数量和文件大小
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  xw-kline:
    image: hub.ssmartoption.com/iqoption-kline:latest
    container_name: xw-kline
    restart: always
    environment:
      CONFIG_FILE: ./config
    volumes:
      - /home/yezhiming/binary/kline:/home/yezhiming/binary/kline/config
      - /home/yezhiming/binary/logs:/home/yezhiming/binary/kline/logs
    network_mode: "host"
    # 日志记录文件数量和文件大小
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"